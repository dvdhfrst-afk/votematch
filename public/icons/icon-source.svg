<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Havesay">
  <!--
    PLACEHOLDER lettermark, not the final Havesay brand icon.
    The real Havesay icon remains open per DEFINITION-OF-WORKING item 6
    ("Havesay branding throughout (real icon, no BB logo)"). This is the
    interim "H" treatment lifted from the guide header glyph so PWA install
    shows a branded tile instead of a browser default. Replace before launch.

    Colors are the civic tokens (globals.css): primary #1a2f5c on the
    app background #fafaf7. No pure #000 / #fff.
  -->
  <rect width="1024" height="1024" rx="180" fill="#fafaf7"/>
  <rect x="150" y="150" width="724" height="724" rx="120" fill="#1a2f5c"/>
  <text x="512" y="512" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700"
        font-size="520" fill="#fafaf7">H</text>
</svg>
